<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e4e6ef;
  --text2: #8b8fa3;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --green: #00cec9;
  --red: #ff6b6b;
  --orange: #fdcb6e;
  --blue: #74b9ff;
  --nidra: #55efc4;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: dark; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0);
}
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 16px !important; }
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text2);
  padding: 10px 2px 8px;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.nav button.active { color: var(--accent2); }
.nav button svg { width: 22px; height: 22px; }
.page { display: none; padding: 16px 16px 96px; max-width: 700px; margin: 0 auto; }
.page.active { display: block; }
h1 { font-size: 24px; margin-bottom: 4px; font-weight: 700; }
h2 { font-size: 16px; margin: 18px 0 8px; font-weight: 600; }
.sub { color: var(--text2); font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
}
.btn.secondary { background: var(--surface2); color: var(--text); }
.btn.small { padding: 6px 14px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--red); border: 1px solid var(--border); padding: 8px 12px; font-size: 13px; border-radius: 8px; }
.day-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  margin-right: 6px;
}
.day-monday { background: #6c5ce7; }
.day-tuesday { background: #00cec9; color: #042e2e; }
.day-wednesday { background: #fdcb6e; color: #333; }
.day-thursday { background: #74b9ff; color: #0c2340; }
.day-friday { background: #ff6b6b; }
.day-saturday { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.day-sunday { background: var(--nidra); color: #06382e; }
.header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.save-state { font-size: 12px; color: var(--green); min-height: 16px; text-align: right; }
.guardrail-banner {
  font-size: 12.5px;
  line-height: 1.35;
  color: #ffe7a3;
  background: rgba(253, 203, 110, 0.08);
  border: 1px solid rgba(253, 203, 110, 0.35);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin: 12px 0;
}
.guard-list { list-style: none; }
.guard-list li {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.4;
}
.guard-list li strong { color: var(--orange); display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.progress-wrap { margin: 8px 0 4px; }
.progress { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--green); width: 0; }
.progress-label { font-size: 12px; color: var(--text2); margin-top: 6px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0; }
.week-nav button {
  background: var(--surface2);
  border: none;
  color: var(--text);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 18px;
  line-height: 1;
}
.week-label { font-size: 13px; color: var(--text2); text-align: center; flex: 1; }
.streak-dots { display: flex; gap: 6px; justify-content: space-between; }
.streak-dot {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  border: 2px solid var(--border);
  color: var(--text2);
  background: none;
  padding: 0;
}
.streak-dot.completed { border-color: var(--green); color: var(--green); background: rgba(0, 206, 201, .1); }
.streak-dot.today { border-color: var(--accent2); color: var(--accent2); }
.streak-dot.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
.section-label {
  font-size: 12px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text2);
  margin: 16px 0 8px;
  font-weight: 600;
}
.note-line {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.4;
}
.exercise-card {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid transparent;
}
.exercise-card.done { border-color: rgba(0, 206, 201, .45); }
.exercise-card.pain { border-color: rgba(255, 107, 107, .55); }
.ex-header { display: flex; align-items: flex-start; gap: 10px; }
.ex-header input[type=checkbox] {
  width: 22px; height: 22px; margin-top: 1px;
  accent-color: var(--green);
  flex-shrink: 0;
}
.ex-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.exercise-card.done .ex-name { color: var(--text2); }
.ex-target { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.35; }
.suggest { font-size: 12px; color: var(--accent2); margin-top: 4px; }
.set-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.set-row input {
  flex: 1;
  min-width: 56px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px;
  color: var(--text);
  text-align: center;
  outline: none;
}
.set-row input:focus { border-color: var(--accent); }
.flags-row {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.flag-check {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text2);
}
.flag-check input { width: 18px; height: 18px; accent-color: var(--red); }
.flag-check.effort input { accent-color: var(--accent); width: auto; min-width: 52px; }
.last-line { font-size: 12px; color: var(--accent2); margin-top: 8px; }
.note-box { margin-top: 8px; }
.note-box label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.note-box textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  min-height: 64px;
  resize: vertical;
  outline: none;
}
.note-box textarea:focus { border-color: var(--accent); }
.tools { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-header { text-align: center; font-size: 11px; color: var(--text2); font-weight: 600; padding: 4px; }
.cal-day {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  font-size: 13px;
  background: var(--surface);
  border: 1px solid transparent;
  color: var(--text);
  padding: 0;
  position: relative;
}
.cal-day.empty { background: transparent; }
.cal-day.today { border-color: var(--accent); }
.cal-day.selected { background: var(--accent); color: #fff; }
.cal-day.before { opacity: .4; }
.cal-day.logged::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
}
.cal-day.tone-monday { box-shadow: inset 0 -3px 0 #6c5ce7; }
.cal-day.tone-tuesday { box-shadow: inset 0 -3px 0 #00cec9; }
.cal-day.tone-wednesday { box-shadow: inset 0 -3px 0 #fdcb6e; }
.cal-day.tone-thursday { box-shadow: inset 0 -3px 0 #74b9ff; }
.cal-day.tone-friday { box-shadow: inset 0 -3px 0 #ff6b6b; }
.cal-day.tone-sunday { box-shadow: inset 0 -3px 0 #55efc4; }
.cal-day.selected.logged::after { background: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 12px; }
.legend span { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
.swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hist-row {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  color: var(--text);
}
.hist-row .when { font-weight: 650; font-size: 15px; }
.hist-row .meta { color: var(--text2); font-size: 13px; margin-top: 3px; }
.hist-row .loads { color: var(--accent2); font-size: 12px; margin-top: 4px; }
.hist-row .pain-tag { color: var(--red); font-size: 12px; margin-top: 4px; font-weight: 600; }
.toast {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0));
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #111;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  z-index: 300;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="toast" class="toast" role="status"></div>
<section id="page-workout" class="page active"></section>
<section id="page-calendar" class="page"></section>
<section id="page-history" class="page"></section>
<section id="page-guardrails" class="page"></section>
<nav class="nav">
  <button type="button" id="nav-workout" class="active" data-page="workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M4 10l6-6 2 2-6 6z"/><path d="M14 14l6 6-2 2-6-6z"/><path d="M9 4l2 2"/><path d="M13 18l2 2"/></svg>
    Today
  </button>
  <button type="button" id="nav-calendar" data-page="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Calendar
  </button>
  <button type="button" id="nav-history" data-page="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
    History
  </button>
  <button type="button" id="nav-guardrails" data-page="guardrails">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
    Guards
  </button>
</nav>
<noscript><div class="page active"><div class="card">JavaScript required. Log stays in this browser.</div></div></noscript>
<script>
(function () {
  var KEY = 'jb_training_log_v1';
  var TZ = 'America/New_York';
  var PROGRAM_START = '2026-09-28';
  var SWIM_START = '2026-10-04';
  var CHEST_WED_START = '2026-10-06';
  var DAY_KEYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  var DAY_SHORT = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  var DAY_TITLE = {
    monday: 'Lifting A',
    tuesday: 'Cardio + PT',
    wednesday: 'Lifting B',
    thursday: 'HIIT + PT',
    friday: 'Lifting C',
    saturday: 'Rest',
    sunday: 'Swim + PT'
  };
  var SUGGEST = {
    'sq-box': '135 lb',
    'press-lm': '35 lb',
    'row-cable': 'next 120 lb (wrist)',
    'acc-floor': '20–25 lb',
    'acc-fly': '20 lb'
  };

  var selected = todayISO();
  var page = 'workout';
  var calYear = parseISO(selected).getFullYear();
  var calMonth = parseISO(selected).getMonth();
  var memory = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function todayISO() {
    var parts = new Date().toLocaleString('en-US', {
      timeZone: TZ,
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).split('/');
    return parts[2] + '-' + parts[0] + '-' + parts[1];
  }

  function weekdayET(iso) {
    // Calendar ISO date in program terms; noon-ish UTC stays same civil day in ET.
    var p = iso.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2], 17, 0, 0));
    var name = d.toLocaleString('en-US', { timeZone: TZ, weekday: 'long' });
    return DAY_KEYS.indexOf(name.toLowerCase());
  }

  function dayKeyET(iso) {
    return DAY_KEYS[weekdayET(iso)];
  }

  function parseISO(iso) {
    var p = iso.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function fmt(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function addDays(iso, n) {
    var d = parseISO(iso);
    d.setDate(d.getDate() + n);
    return fmt(d);
  }
  function mondayOf(iso) {
    var d = parseISO(iso);
    var day = weekdayET(iso);
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return fmt(d);
  }
  function weekNumber(iso) {
    if (iso < PROGRAM_START) return 0;
    var days = Math.round((parseISO(iso) - parseISO(PROGRAM_START)) / 86400000);
    return Math.floor(days / 7) + 1;
  }
  function pretty(iso, withWeekday) {
    var p = iso.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2], 17, 0, 0));
    var opt = { timeZone: TZ, month: 'short', day: 'numeric' };
    if (withWeekday) opt.weekday = 'short';
    return d.toLocaleDateString('en-US', opt);
  }
  function longDate(iso) {
    var p = iso.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2], 17, 0, 0));
    return d.toLocaleDateString('en-US', {
      timeZone: TZ, weekday: 'long', month: 'long', day: 'numeric'
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function item(id, name, detail, kind) {
    return { id: id, name: name, detail: detail, kind: kind || 'check' };
  }

  var REHAB2_START = '2026-10-13';
  function ptItems(iso) {
    if (iso && iso >= REHAB2_START) {
      return [
        item('pt2-sler', 'Side-lying external rotation', '3×12 · 2–5 lb'),
        item('pt2-bir', 'Band internal rotation, elbow at side', '3×12'),
        item('pt2-scap', 'Scaption raise, thumbs up, to shoulder height', '3×12 · 2–5 lb'),
        item('pt2-prer', 'Prone row into external rotation', '2×10 · 0–3 lb'),
        item('pt2-wsr', 'Wall slide w/ foam roller, lift off at top', '2×10'),
        item('pt-face', 'Face pulls', '3×15'),
        item('pt2-wext', 'Wrist extension eccentrics', '3×12 · 2–3 lb · forearm on knee · drop if puffier'),
        item('pt2-wflex', 'Wrist flexion eccentrics', '3×12 · 2–3 lb · drop if puffier'),
        item('pt2-dev', 'Radial/ulnar deviation, hammer hold, no twisting', '2×12 each · drop if puffier'),
        item('pt2-grip', 'Grip squeeze ball/putty', '3×30s · medium'),
        item('pt-wiso', 'Wrist isometrics', '3×30s each direction'),
        item('pt-clam', 'Clamshells', '2×15/side'),
        item('pt-bridge', 'SL glute bridge', '3×10/side'),
        item('pt-walk', 'Band walks', '2×12 each way'),
        item('pt-hf', 'Half-kneeling hip flexor', '2×45s/side'),
        item('pt-bug', 'Dead bug', '2×10/side'),
        item('pt-side', 'Forearm side plank', '2×30s/side')
      ];
    }
    return [
      item('pt-er', 'Band ER', '3×15'),
      item('pt-face', 'Face pulls', '3×15'),
      item('pt-serr', 'Serratus wall slide', '2×10'),
      item('pt-yt', 'Prone Y/T', '2×10 · 0–2 lb'),
      item('pt-clam', 'Clamshells', '2×15/side'),
      item('pt-bridge', 'SL glute bridge', '3×10/side'),
      item('pt-walk', 'Band walks', '2×12 each way'),
      item('pt-hf', 'Half-kneeling hip flexor', '2×45s/side'),
      item('pt-wiso', 'Wrist isometrics', '5×30–45s'),
      item('pt-wrot', 'Rotation isometrics', '5×20–30s'),
      item('pt-bug', 'Dead bug', '2×10/side'),
      item('pt-side', 'Forearm side plank', '2×30s/side')
    ];
  }

  var PT_NOTE = 'PT: pain ≤3/10, wrist straight. Wrist puffier next morning → drop wrist eccentrics + deviation that week. No wrist curls under load beyond 2–3 lb eccentrics; no loaded twisting.';
  function primer(iso) {
    return iso >= REHAB2_START ? [{ title: 'Joint primer (5 min)', items: [
      item('pr-er', 'Band ER', '2×15'),
      item('pr-ws', 'Wall slides', '1×10'),
      item('pr-wiso', 'Wrist isometrics', '2×30s')
    ]}] : [];
  }
  function getPlan(iso) {
    var key = dayKeyET(iso);
    var base = {
      key: key,
      title: DAY_TITLE[key],
      subtitle: '',
      rest: false,
      note: '',
      sections: []
    };
    if (iso < PROGRAM_START) {
      base.title = 'Not started';
      base.subtitle = 'Plan starts Mon Sep 28.';
      base.rest = true;
      return base;
    }
    if (key === 'saturday') {
      base.subtitle = 'Full rest.';
      base.rest = true;
      return base;
    }
    if (key === 'sunday' && iso < SWIM_START) {
      base.title = 'Swim later';
      base.subtitle = 'First swim Sun Oct 4.';
      base.rest = true;
      return base;
    }
    if (key === 'monday') {
      base.note = 'Warm-up ~8 min: easy row, cat-cow, world’s greatest, leg swings, BW box squat, glute bridge, band pull-aparts, arm circles/wall slides, wrist circles, ramp-ups.' + (iso >= REHAB2_START ? ' Plus 5-min joint primer.' : '');
      base.sections = primer(iso).concat([
        { title: 'Main', items: [
          item('sq-box', 'High box squat', '5×5 · hips above knees', 'strength'),
          item('press-lm', 'Half-kneeling landmine press', '5×5', 'strength'),
          item('row-cable', 'Seated cable row', '5×5 · neutral straps, wrist straight', 'strength'),
          item('sq-rfess', 'RFE split squat', '5×5/leg', 'strength')
        ]},
        { title: 'After', items: [
          item('mob-couch', 'Couch stretch', '30–45s/side'),
          item('mob-hf', 'Hip flexor stretch', '30–45s/side')
        ]}
      ]);
      return base;
    }
    if (key === 'tuesday') {
      base.subtitle = 'No chest on Tuesday.';
      if (iso >= REHAB2_START) base.note = PT_NOTE;
      base.sections = [
        { title: 'Cardio', items: [
          item('cardio-easy', 'Easy cardio', '25–30 min · run/row/ski')
        ]},
        { title: 'PT block', items: ptItems(iso) },
        { title: 'Accessories', items: [
          item('acc-shrug', 'Shrugs', '3×12 · straps', 'strength'),
          item('acc-pallof', 'Pallof', '3×10/side', 'strength'),
          item('acc-mcgill', 'McGill curl-up', '3×8')
        ]}
      ];
      return base;
    }
    if (key === 'wednesday') {
      base.note = 'Warm-up ~8 min, then main lifts. ' + (iso < '2026-10-26' ? 'Chest PAUSED until Oct 26 retest.' : 'Chest after mains.') + (iso >= REHAB2_START ? ' Add 5-min joint primer first.' : '');
      var sections = primer(iso).concat([
        { title: 'Main', items: [
          item('dl-trap', 'Trap bar DL', '5×5 · high handles, straps', 'strength'),
          item('press-ohp', 'OH press', '5×5 · normal or neutral', 'strength'),
          item('pull-neutral', 'Neutral pull-ups / lat pulldown', '5×5 · straps', 'strength'),
          item('hip-thrust', 'Barbell hip thrust', '5×5', 'strength')
        ]}
      ]);
      if (iso >= CHEST_WED_START) {
        var chestPaused = iso >= '2026-10-08' && iso < '2026-10-26';
        sections.push({ title: chestPaused ? 'Chest — PAUSED until Oct 26 retest (skip)' : 'Chest', items: [
          item('acc-floor', 'NG DB floor press', '3×10 · ~20–25 lb · elbows ~45°', 'strength'),
          item('acc-fly', 'Cable fly', '3×12 · ~20 lb · stop at chest line', 'strength')
        ]});
      }
      sections.push({ title: 'After', items: [
        item('mob-couch', 'Couch stretch', '30–45s/side'),
        item('mob-hf', 'Hip flexor stretch', '30–45s/side')
      ]});
      base.sections = sections;
      return base;
    }
    if (key === 'thursday') {
      var wk = weekNumber(iso);
      if (iso >= REHAB2_START) base.note = PT_NOTE;
      var hiitDetail = (wk >= 1 && wk <= 2)
        ? '30s/90s · 6 rounds · rower/ski (weeks 1–2)'
        : '30s/90s · 6 rounds · rower/ski';
      base.sections = [
        { title: 'HIIT', items: [
          item('hiit-wu', 'Easy warm-up', '5 min'),
          item('hiit-work', 'Intervals', hiitDetail),
          item('hiit-cd', 'Cool-down', '5 min')
        ]},
        { title: 'PT block', items: ptItems(iso) },
        { title: 'Accessories', items: [
          item('acc-shrug', 'Shrugs', '3×12 · straps', 'strength'),
          item('acc-pallof', 'Pallof', '3×10/side', 'strength'),
          item('thu-couch', 'Couch stretch', '2×45s/side')
        ]}
      ];
      return base;
    }
    if (key === 'friday') {
      base.note = 'Warm-up ~8 min, then four main lifts.' + (iso >= REHAB2_START ? ' Add 5-min joint primer first.' : '');
      base.sections = primer(iso).concat([
        { title: 'Main', items: [
          item('press-leg', 'Leg press', '5×5 · pain-free depth', 'strength'),
          item('press-lm', 'Landmine press', '5×5', 'strength'),
          item('row-hs', 'HS row', '5×5 · straps, wrist straight', 'strength'),
          item('rdl-sl', 'SL RDL', '5×5/leg', 'strength')
        ]},
        { title: 'After', items: [
          item('mob-couch', 'Couch stretch', '30–45s/side'),
          item('mob-hf', 'Hip flexor stretch', '30–45s/side')
        ]}
      ]);
      return base;
    }
    if (iso >= REHAB2_START) base.note = PT_NOTE;
    base.sections = [
      { title: 'Cardio', items: [
        item('swim', 'Easy swim 20–30 or run/row 40–45', 'kickboard/fins OK · no breaststroke kick')
      ]},
      { title: 'PT block', items: ptItems(iso) }
    ];
    return base;
  }

  function countItems(plan) {
    var total = 0;
    plan.sections.forEach(function (sec) {
      total += sec.items.length;
    });
    return total;
  }

  function load() {
    if (memory) return memory;
    try {
      var raw = localStorage.getItem(KEY);
      memory = raw ? JSON.parse(raw) : { days: {} };
    } catch (e) {
      memory = { days: {} };
    }
    if (!memory.days) memory.days = {};
    return memory;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(memory)); } catch (e) {}
  }
  function dayRec(iso, create) {
    var data = load();
    if (!data.days[iso] && create) {
      data.days[iso] = { title: '', note: '', items: {} };
    }
    return data.days[iso] || null;
  }
  function hasLog(rec) {
    if (!rec) return false;
    if ((rec.note || '').trim()) return true;
    var items = rec.items || {};
    return Object.keys(items).some(function (id) {
      var it = items[id] || {};
      return !!(it.done || it.pain || String(it.weight || '').trim() || String(it.reps || '').trim() || String(it.sets || '').trim() || String(it.effort || '').trim());
    });
  }
  function blankSaved() {
    return { done: false, weight: '', reps: '', sets: '', effort: '', pain: false };
  }
  function savedItem(iso, id) {
    var rec = dayRec(iso, false);
    var it = rec && rec.items ? rec.items[id] : null;
    if (!it) return blankSaved();
    return {
      done: !!it.done,
      weight: it.weight != null ? String(it.weight) : '',
      reps: it.reps != null ? String(it.reps) : '',
      sets: it.sets != null ? String(it.sets) : '',
      effort: it.effort != null ? String(it.effort) : '',
      pain: !!it.pain
    };
  }
  function lastPerf(id, before) {
    var days = load().days;
    var dates = Object.keys(days).filter(function (d) { return d < before; }).sort().reverse();
    for (var i = 0; i < dates.length; i++) {
      var it = days[dates[i]].items && days[dates[i]].items[id];
      if (it && (String(it.weight || '').trim() || String(it.reps || '').trim() || String(it.sets || '').trim())) {
        return { date: dates[i], weight: it.weight || '', reps: it.reps || '', sets: it.sets || '', effort: it.effort || '' };
      }
    }
    return null;
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove('show'); }, 1400);
  }

  function showPage(next) {
    page = next;
    if (next === 'workout' && arguments.length > 1) selected = arguments[1];
    document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
    document.querySelectorAll('.nav button').forEach(function (b) { b.classList.remove('active'); });
    document.getElementById('page-' + next).classList.add('active');
    document.getElementById('nav-' + next).classList.add('active');
    window.scrollTo(0, 0);
    if (next === 'workout') renderWorkout();
    else if (next === 'calendar') renderCalendar();
    else if (next === 'history') renderHistory();
    else renderGuardrails();
  }

    if (plan.subtitle) html += '<p class="sub">' + esc(plan.subtitle) + '</p>';

          html += '<input data-id="' + esc(it.id) + '" data-field="sets" inputmode="numeric" autocomplete="off" placeholder="sets" aria-label="Sets" value="' + esc(saved.sets) + '">';

          html += '<div class="flags-row">';
          html += '<label class="flag-check effort">Effort <input data-id="' + esc(it.id) + '" data-field="effort" inputmode="numeric" autocomplete="off" placeholder="1–10" aria-label="Effort" value="' + esc(saved.effort) + '"></label>';
          html += '<label class="flag-check"><input type="checkbox" data-id="' + esc(it.id) + '" data-field="pain"' + (saved.pain ? ' checked' : '') + '> Pain</label>';
          html += '</div>';
          var last = lastPerf(it.id, selected);
          if (last) {
            var bits = [];
            if (String(last.weight).trim()) bits.push(String(last.weight).trim() + ' lb');
            if (String(last.sets).trim()) bits.push(String(last.sets).trim() + '×');
            if (String(last.reps).trim()) bits.push(String(last.reps).trim());
            if (String(last.effort).trim()) bits.push('RPE ' + String(last.effort).trim());
            html += '<div class="last-line">Last ' + esc(pretty(last.date, true)) + ': ' + esc(bits.join(' ')) + '</div>';
          }
        } else {
          html += '<div class="flags-row">';
          html += '<label class="flag-check effort">Effort <input data-id="' + esc(it.id) + '" data-field="effort" inputmode="numeric" autocomplete="off" placeholder="1–10" aria-label="Effort" value="' + esc(saved.effort) + '"></label>';
          html += '<label class="flag-check"><input type="checkbox" data-id="' + esc(it.id) + '" data-field="pain"' + (saved.pain ? ' checked' : '') + '> Pain</label>';
          html += '</div>';
        }
        html += '</div>';
      });
    });
    if (!plan.rest) {
      var note = rec && rec.note ? rec.note : '';
      html += '<div class="note-box"><label for="day-note">Note</label>';
      html += '<textarea id="day-note" placeholder="Pain, sleep, how it felt">' + esc(note) + '</textarea></div>';
      html += '<div class="tools"><span class="sub" style="margin:0">localStorage only</span>';
      html += '<button type="button" class="btn danger" id="clear-day">Clear day</button></div>';
    } else {
      html += '<div class="card"><div class="ex-name">' + esc(plan.title) + '</div><div class="ex-target" style="margin-top:6px">' + esc(plan.subtitle) + '</div></div>';
    }
    document.getElementById('page-workout').innerHTML = html;
    if (!plan.rest) setProgress(done, total);
  }

  function weekStripHTML() {
    var mon = mondayOf(selected);
    var html = '<div class="week-nav"><button type="button" id="prev-week" aria-label="Previous week">‹</button>';
    html += '<div class="week-label">' + esc(weekCaption(selected)) + '</div>';
    html += '<button type="button" id="next-week" aria-label="Next week">›</button></div>';
    html += '<div class="streak-dots">';
    for (var i = 0; i < 7; i++) {
      var iso = addDays(mon, i);
      var cls = 'streak-dot';
      if (hasLog(dayRec(iso, false))) cls += ' completed';
      if (iso === todayISO()) cls += ' today';
      if (iso === selected) cls += ' selected';
      html += '<button type="button" class="' + cls + '" data-date="' + iso + '">' + DAY_SHORT[weekdayET(iso)] + '</button>';
    }
    html += '</div>';
    return html;
  }
  function weekCaption(iso) {
    var mon = mondayOf(iso);
    var sun = addDays(mon, 6);
    var w = weekNumber(iso);
    var prefix = w > 0 ? 'Week ' + w : 'Before start';
    return prefix + ' · ' + pretty(mon, false) + ' – ' + pretty(sun, false);
  }
  function setProgress(done, total) {
    var bar = document.getElementById('bar');
    var label = document.getElementById('progress-label');
    if (!bar || !label) return;
    var pct = total ? Math.round((done / total) * 100) : 0;
    bar.style.width = pct + '%';
    label.textContent = done + ' of ' + total + ' done';
  }
  function recount() {
    var plan = getPlan(selected);
    var done = 0;
    var total = countItems(plan);
    plan.sections.forEach(function (sec) {
      sec.items.forEach(function (it) {
        if (savedItem(selected, it.id).done) done += 1;
      });
    });
    setProgress(done, total);
  }
  function touchDay() {
    var rec = dayRec(selected, true);
    rec.title = getPlan(selected).title;
    return rec;
  }
  function markSaved() {
    var el = document.getElementById('save-state');
    if (el) el.textContent = 'Saved';
  }
  function setField(id, field, value) {
    var rec = touchDay();
    if (!rec.items[id]) rec.items[id] = blankSaved();
    if (field === 'done' || field === 'pain') rec.items[id][field] = !!value;
    else rec.items[id][field] = value;
    persist();
    markSaved();
    if (field === 'done' || field === 'pain') {
      var row = document.querySelector('[data-row="' + id + '"]');
      if (row) {
        if (field === 'done') row.classList.toggle('done', !!value);
        if (field === 'pain') row.classList.toggle('pain', !!value);
      }
      if (field === 'done') recount();
    }
  }
  function setNote(value) {
    touchDay().note = value;
    persist();
    markSaved();
  }

  function renderCalendar() {
    var label = parseISO(fmt(new Date(calYear, calMonth, 1))).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: TZ });
    var first = new Date(calYear, calMonth, 1);
    var startPad = (first.getDay() + 6) % 7;
    var lastDate = new Date(calYear, calMonth + 1, 0).getDate();
    var html = '<h1>Calendar</h1><p class="sub">Tap a day. Chest is on Wednesday from Oct 6.</p>';
    html += '<div class="week-nav"><button type="button" id="cal-prev" aria-label="Previous month">‹</button>';
    html += '<div class="week-label">' + esc(label) + '</div>';
    html += '<button type="button" id="cal-next" aria-label="Next month">›</button></div>';
    html += '<div class="cal-grid">';
    ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(function (h) {
      html += '<div class="cal-header">' + h + '</div>';
    });
    for (var i = 0; i < startPad; i++) html += '<div class="cal-day empty"></div>';
    for (var day = 1; day <= lastDate; day++) {
      var iso = calYear + '-' + pad(calMonth + 1) + '-' + pad(day);
      var key = dayKeyET(iso);
      var cls = 'cal-day tone-' + key;
      if (iso === todayISO()) cls += ' today';
      if (iso === selected) cls += ' selected';
      if (iso < PROGRAM_START) cls += ' before';
      if (hasLog(dayRec(iso, false))) cls += ' logged';
      html += '<button type="button" class="' + cls + '" data-date="' + iso + '">' + day + '</button>';
    }
    html += '</div>';
    html += '<div class="legend">';
    html += '<span><i class="swatch" style="background:#6c5ce7"></i>Lift A</span>';
    html += '<span><i class="swatch" style="background:#00cec9"></i>Cardio</span>';
    html += '<span><i class="swatch" style="background:#fdcb6e"></i>Lift B</span>';
    html += '<span><i class="swatch" style="background:#74b9ff"></i>HIIT</span>';
    html += '<span><i class="swatch" style="background:#ff6b6b"></i>Lift C</span>';
    html += '<span><i class="swatch" style="background:#55efc4"></i>Swim</span>';
    html += '</div>';
    document.getElementById('page-calendar').innerHTML = html;
  }

  function renderHistory() {
    var data = load();
    var dates = Object.keys(data.days).filter(function (d) { return hasLog(data.days[d]); }).sort().reverse();
    var html = '<h1>History</h1><p class="sub">Logged days (this phone).</p>';
    if (!dates.length) {
      html += '<div class="card">No days logged yet.</div>';
    }
    dates.slice(0, 40).forEach(function (iso) {
      var plan = getPlan(iso);
      var rec = data.days[iso];
      var total = countItems(plan);
      var done = 0;
      var loads = [];
      var painCount = 0;
      plan.sections.forEach(function (sec) {
        sec.items.forEach(function (it) {
          var saved = rec.items && rec.items[it.id];
          if (saved && saved.done) done += 1;
          if (saved && saved.pain) painCount += 1;
          if (saved && it.kind === 'strength' && (String(saved.weight || '').trim() || String(saved.reps || '').trim())) {
            var extra = [];
            if (String(saved.weight || '').trim()) extra.push(String(saved.weight).trim() + 'lb');
            if (String(saved.sets || '').trim() && String(saved.reps || '').trim()) {
              extra.push(String(saved.sets).trim() + '×' + String(saved.reps).trim());
            } else if (String(saved.reps || '').trim()) {
              extra.push(String(saved.reps).trim());
            }
            loads.push(it.name + (extra.length ? ' ' + extra.join(' ') : ''));
          }
        });
      });
      html += '<button type="button" class="hist-row" data-date="' + iso + '">';
      html += '<div class="when">' + esc(pretty(iso, true)) + '</div>';
      html += '<div class="meta">' + esc(rec.title || plan.title) + (total ? ' · ' + done + '/' + total : '') + '</div>';
      if (loads.length) html += '<div class="loads">' + esc(loads.slice(0, 3).join(' · ')) + (loads.length > 3 ? ' …' : '') + '</div>';
      if (painCount) html += '<div class="pain-tag">Pain flagged ×' + painCount + '</div>';
      if ((rec.note || '').trim()) html += '<div class="meta">' + esc(rec.note.trim()) + '</div>';
      html += '</button>';
    });
    document.getElementById('page-history').innerHTML = html;
  }

  document.getElementById('page-workout').addEventListener('click', function (e) {
    if (e.target.id === 'jump-today' || e.target.closest('#jump-today')) {
      selected = todayISO();
      renderWorkout();
      return;
    }
    if (e.target.id === 'prev-week') { selected = addDays(selected, -7); renderWorkout(); return; }
    if (e.target.id === 'next-week') { selected = addDays(selected, 7); renderWorkout(); return; }
    if (e.target.id === 'clear-day') {
      if (!confirm('Clear this day’s checks, weights, and note?')) return;
      delete load().days[selected];
      persist();
      showToast('Cleared');
      renderWorkout();
      return;
    }
    var dot = e.target.closest('.streak-dot');
    if (dot && dot.dataset.date) { selected = dot.dataset.date; renderWorkout(); return; }
    var row = e.target.closest('[data-row]');
    if (!row) return;
    if (e.target.closest('input, textarea, button, a, label')) return;
    var box = row.querySelector('input[type=checkbox][data-field=done]');
    if (!box) return;
    box.checked = !box.checked;
    box.dispatchEvent(new Event('change', { bubbles: true }));
  });
  document.getElementById('page-workout').addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.id && (t.dataset.field === 'done' || t.dataset.field === 'pain')) {
      setField(t.dataset.id, t.dataset.field, t.checked);
    }
  });
  document.getElementById('page-workout').addEventListener('input', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'day-note') { setNote(t.value); return; }
    if (t.dataset && t.dataset.id && t.dataset.field && t.dataset.field !== 'done' && t.dataset.field !== 'pain') {
      setField(t.dataset.id, t.dataset.field, t.value);
    }
  });
  document.getElementById('page-calendar').addEventListener('click', function (e) {
    if (e.target.id === 'cal-prev') {
      calMonth -= 1;
      if (calMonth < 0) { calMonth = 11; calYear -= 1; }
      renderCalendar();
      return;
    }
    if (e.target.id === 'cal-next') {
      calMonth += 1;
      if (calMonth > 11) { calMonth = 0; calYear += 1; }
      renderCalendar();
      return;
    }
    var btn = e.target.closest('.cal-day');
    if (btn && btn.dataset.date) showPage('workout', btn.dataset.date);
  });
  document.getElementById('page-history').addEventListener('click', function (e) {
    var btn = e.target.closest('.hist-row');
    if (btn && btn.dataset.date) showPage('workout', btn.dataset.date);

  document.querySelectorAll('.nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.page === 'workout') showPage('workout', todayISO());
      else if (b.dataset.page === 'calendar') {
        calYear = parseISO(selected).getFullYear();
        calMonth = parseISO(selected).getMonth();
        showPage('calendar');
      } else showPage(b.dataset.page);
    });
  });

  function namesOn(iso) {
    var plan = getPlan(iso);
    var out = [];
    plan.sections.forEach(function (sec) {
      sec.items.forEach(function (it) { out.push(it.name); });
    });
    return out;
  }
  function has(iso, re) { return namesOn(iso).some(function (n) { return re.test(n); }); }

  function audit() {
    var errors = [];
    if (has('2026-10-06', /floor press|Cable fly|cable fly/)) errors.push('chest still on Tue Oct 6');
    if (has('2026-10-07', /floor press/) === false) errors.push('chest missing Wed Oct 7');
    if (has('2026-10-07', /Cable fly|cable fly/) === false) errors.push('fly missing Wed Oct 7');
    if (has('2026-09-30', /floor press|Cable fly/)) errors.push('chest before Oct 6 on Wed');
    if (has('2026-10-06', /McGill/) === false) errors.push('mcgill missing tuesday');
    if (has('2026-10-08', /McGill/)) errors.push('mcgill on thursday');
    if (getPlan('2026-10-03').rest !== true) errors.push('saturday not rest');
    if (JSON.stringify(getPlan('2026-10-01')).indexOf('6 rounds') === -1) errors.push('hiit rounds');
    if (has('2026-10-04', /swim|run\/row/) === false) errors.push('swim missing Oct 4');
    if (dayKeyET('2026-10-06') !== 'tuesday') errors.push('ET weekday Oct 6');
    if (dayKeyET('2026-10-07') !== 'wednesday') errors.push('ET weekday Oct 7');
    if (has('2026-10-13', /Side-lying external rotation/) === false) errors.push('new PT missing Tue Oct 13');
    if (has('2026-10-15', /Wrist extension eccentrics/) === false) errors.push('new PT missing Thu Oct 15');
    if (has('2026-10-18', /Grip squeeze/) === false) errors.push('new PT missing Sun Oct 18');
    if (has('2026-10-13', /Rotation isometrics|Prone Y|Serratus/)) errors.push('old PT still on Oct 13');
    if (has('2026-10-14', /Wall slides/) === false) errors.push('primer missing Wed Oct 14');
    return errors;
  }

  var problems = audit();
  if (problems.length) {
    var banner = document.createElement('div');
    banner.className = 'guardrail-banner';
    banner.style.color = '#ff6b6b';
    banner.textContent = 'Schedule check failed: ' + problems.join('; ');
    document.body.insertBefore(banner, document.body.firstChild);
  }
  showPage('workout', todayISO());
})();
</script>
