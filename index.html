<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e4e6ef;
  --text2: #8b8fa3;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --green: #00cec9;
  --red: #ff6b6b;
  --orange: #fdcb6e;
  --blue: #74b9ff;
  --nidra: #55efc4;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: dark; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0);
}
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 16px !important; }
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text2);
  padding: 10px 2px 8px;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.nav button.active { color: var(--accent2); }
.nav button svg { width: 22px; height: 22px; }
.page { display: none; padding: 16px 16px 96px; max-width: 700px; margin: 0 auto; }
.page.active { display: block; }
h1 { font-size: 24px; margin-bottom: 4px; font-weight: 700; }
h2 { font-size: 16px; margin: 18px 0 8px; font-weight: 600; }
.sub { color: var(--text2); font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
}
.btn.secondary { background: var(--surface2); color: var(--text); }
.btn.small { padding: 6px 14px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--red); border: 1px solid var(--border); padding: 8px 12px; font-size: 13px; border-radius: 8px; }
.day-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  margin-right: 6px;
}
.day-monday { background: #6c5ce7; }
.day-tuesday { background: #00cec9; color: #042e2e; }
.day-wednesday { background: #fdcb6e; color: #333; }
.day-thursday { background: #74b9ff; color: #0c2340; }
.day-friday { background: #ff6b6b; }
.day-saturday { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.day-sunday { background: var(--nidra); color: #06382e; }
.header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.save-state { font-size: 12px; color: var(--green); min-height: 16px; text-align: right; }
.guardrail-banner {
  font-size: 12.5px;
  line-height: 1.35;
  color: #ffe7a3;
  background: rgba(253, 203, 110, 0.08);
  border: 1px solid rgba(253, 203, 110, 0.35);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin: 12px 0;
}
.guard-list { list-style: none; }
.guard-list li {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.4;
}
.guard-list li strong { color: var(--orange); display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.progress-wrap { margin: 8px 0 4px; }
.progress { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--green); width: 0; }
.progress-label { font-size: 12px; color: var(--text2); margin-top: 6px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0; }
.week-nav button {
  background: var(--surface2);
  border: none;
  color: var(--text);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 18px;
  line-height: 1;
}
.week-label { font-size: 13px; color: var(--text2); text-align: center; flex: 1; }
.streak-dots { display: flex; gap: 6px; justify-content: space-between; }
.streak-dot {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  border: 2px solid var(--border);
  color: var(--text2);
  background: none;
  padding: 0;
}
.streak-dot.completed { border-color: var(--green); color: var(--green); background: rgba(0, 206, 201, .1); }
.streak-dot.today { border-color: var(--accent2); color: var(--accent2); }
.streak-dot.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
.section-label {
  font-size: 12px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text2);
  margin: 16px 0 8px;
  font-weight: 600;
}
.note-line {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.4;
}
.exercise-card {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid transparent;
}
.exercise-card.done { border-color: rgba(0, 206, 201, .45); }
.exercise-card.pain { border-color: rgba(255, 107, 107, .55); }
.ex-header { display: flex; align-items: flex-start; gap: 10px; }
.ex-header input[type=checkbox] {
  width: 22px; height: 22px; margin-top: 1px;
  accent-color: var(--green);
  flex-shrink: 0;
}
.ex-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.exercise-card.done .ex-name { color: var(--text2); }
.vids { font-size: 12px; margin-top: 4px; } .vids a { color: var(--accent, #4ea1ff); }
.ex-target { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.35; }
.suggest { font-size: 12px; color: var(--accent2); margin-top: 4px; }
.set-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.set-row input {
  flex: 1;
  min-width: 56px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px;
  color: var(--text);
  text-align: center;
  outline: none;
}
.set-row input:focus { border-color: var(--accent); }
.flags-row {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.flag-check {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text2);
}
.flag-check input { width: 18px; height: 18px; accent-color: var(--red); }
.flag-check.effort input { accent-color: var(--accent); width: auto; min-width: 52px; }
.last-line { font-size: 12px; color: var(--accent2); margin-top: 8px; }
.note-box { margin-top: 8px; }
.note-box label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.note-box textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  min-height: 64px;
  resize: vertical;
  outline: none;
}
.note-box textarea:focus { border-color: var(--accent); }
.tools { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-header { text-align: center; font-size: 11px; color: var(--text2); font-weight: 600; padding: 4px; }
.cal-day {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  font-size: 13px;
  background: var(--surface);
  border: 1px solid transparent;
  color: var(--text);
  padding: 0;
  position: relative;
}
.cal-day.empty { background: transparent; }
.cal-day.today { border-color: var(--accent); }
.cal-day.selected { background: var(--accent); color: #fff; }
.cal-day.before { opacity: .4; }
.cal-day.logged::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
}
.cal-day.tone-monday { box-shadow: inset 0 -3px 0 #6c5ce7; }
.cal-day.tone-tuesday { box-shadow: inset 0 -3px 0 #00cec9; }
.cal-day.tone-wednesday { box-shadow: inset 0 -3px 0 #fdcb6e; }
.cal-day.tone-thursday { box-shadow: inset 0 -3px 0 #74b9ff; }
.cal-day.tone-friday { box-shadow: inset 0 -3px 0 #ff6b6b; }
.cal-day.tone-sunday { box-shadow: inset 0 -3px 0 #55efc4; }
.cal-day.selected.logged::after { background: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 12px; }
.legend span { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
.swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hist-row {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  color: var(--text);
}
.hist-row .when { font-weight: 650; font-size: 15px; }
.hist-row .meta { color: var(--text2); font-size: 13px; margin-top: 3px; }
.hist-row .loads { color: var(--accent2); font-size: 12px; margin-top: 4px; }
.hist-row .pain-tag { color: var(--red); font-size: 12px; margin-top: 4px; font-weight: 600; }
.toast {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0));
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #111;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  z-index: 300;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.min-tag{display:inline-block;background:#fdcb6e;color:#1a1a1a;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:middle}
.sets-grid{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pset{display:flex;align-items:center;gap:8px}
.pset-n{width:22px;color:var(--muted,#999);font-weight:700;text-align:center}
.pset-x{color:var(--muted,#999)}
.pset input{flex:1;min-width:0;min-height:48px;font-size:18px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;color:var(--text);text-align:center;outline:none}
.pset input:focus{border-color:var(--accent)}
.add-set{min-height:44px;align-self:flex-start;padding:0 18px}
</style>
</head>

<section id="page-workout" class="page active"></section>

<section id="page-history" class="page"></section>
<section id="page-guardrails" class="page"></section>

</nav>

          var saved = rec.items && rec.items[it.id];
          if (saved && saved.done) done += 1;
          if (saved && saved.pain) painCount += 1;
          if (saved && it.kind === 'strength' && setLogText(saved.setLog)) { loads.push(it.name + ': ' + setLogText(saved.setLog)); return; }
          if (saved && it.kind === 'strength' && (String(saved.weight || '').trim() || String(saved.reps || '').trim())) {
            var extra = [];
            if (String(saved.weight || '').trim()) extra.push(String(saved.weight).trim() + 'lb');
            if (String(saved.sets || '').trim() && String(saved.reps || '').trim()) {
              extra.push(String(saved.sets).trim() + '×' + String(saved.reps).trim());
            } else if (String(saved.reps || '').trim()) {
              extra.push(String(saved.reps).trim());
            }
            loads.push(it.name + (extra.length ? ' ' + extra.join(' ') : ''));
          }
        });
      });
      html += '<button type="button" class="hist-row" data-date="' + iso + '">';
      html += '<div class="when">' + esc(pretty(iso, true)) + '</div>';
      html += '<div class="meta">' + esc(rec.title || plan.title) + (total ? ' · ' + done + '/' + total : '') + '</div>';
      if (loads.length) html += '<div class="loads">' + esc(loads.join(' · ')) + '</div>';
      if (painCount) html += '<div class="pain-tag">Pain flagged ×' + painCount + '</div>';
      if ((rec.note || '').trim()) html += '<div class="meta">' + esc(rec.note.trim()) + '</div>';
      html += '</button>';
    });
    document.getElementById('page-history').innerHTML = html;
    renderSendMore();
  }

  function renderGuardrails() {
    var html = '<h1>Guardrails</h1><p class="sub">Hard rules for this block.</p>';
    html += '<ul class="guard-list">';
    html += '<li><strong>Pain</strong>Pain ≤3/10 is OK if it is settled/normal by morning. Otherwise stop or regress.</li>';
    html += '<li><strong>Wrist</strong>Keep wrist straight. Brace + straps on pulls. No bent-back wrist under load.</li>';
    html += '<li><strong>No pressing patterns</strong>No flat or incline bench, dips, or push-ups.</li>';
    html += '<li><strong>No forearm loading</strong>No loaded twisting, skullcrushers, straight-bar curls, or pinch grips. Arms (Tue/Thu from Oct 13): V-bar pushdown + neutral hammer curl only, light, wrist straight. No wrist curls under load beyond 2–3 lb eccentrics (PT block from Oct 13).</li>';
    html += '<li><strong>Wrist puffier next morning</strong>Drop wrist extension/flexion eccentrics and radial/ulnar deviation for that week.</li>';
    html += '<li><strong>No deep hip openers</strong>No pigeon, frog, or deep 90/90.</li>';
    html += '<li><strong>Krav Maga</strong>Off until week of Oct 26 retest.</li>';
    html += '<li><strong>Chest placement</strong>NG DB floor press + cable fly PAUSED (shoulder, Oct 7) until week of Oct 26 retest. Wed only after that. No chest on Tuesday.</li>';
    html += '<li><strong>Cable row</strong>Monday next weight 120 lb, straps, brace, wrist straight.</li>';
    html += '<li><strong>Depth</strong>Squat and leg press only to pain-free depth.</li>';
    html += '</ul>';
    document.getElementById('page-guardrails').innerHTML = html;
  }

  function handleSend(e, iso) {
    var b = e.target.closest('[data-send]'); if (!b) return false;
    if (b.dataset.send === 'mail') sendToTrainer(iso);
    else if (b.dataset.send === 'copy') copyLog(iso);
    else openPart();
    var page = document.querySelector('.page.active');
    setTimeout(function () { if (page && page.id === 'page-history') renderHistory(); else renderWorkout(); }, 50);
    return true;
  }
  document.getElementById('page-workout').addEventListener('click', function (e) {
    if (handleSend(e, selected)) return;
    if (e.target.id === 'jump-today' || e.target.closest('#jump-today')) {
      selected = todayISO();
      renderWorkout();
      return;
    }
    if (e.target.id === 'prev-week') { selected = addDays(selected, -7); renderWorkout(); return; }
    if (e.target.id === 'next-week') { selected = addDays(selected, 7); renderWorkout(); return; }
    if (e.target.id === 'clear-day') {
      if (!confirm('Clear this day’s checks, weights, and note?')) return;
      delete load().days[selected];
      persist();
      showToast('Cleared');
      renderWorkout();
      return;
    }
    var add = e.target.closest('[data-addset]');
    if (add) { var r1 = touchDay(); var aid = add.dataset.addset; if (!r1.items[aid]) r1.items[aid] = blankSaved(); r1.items[aid].extraSets = (r1.items[aid].extraSets || 0) + 1; persist(); renderWorkout(); return; }
    var dot = e.target.closest('.streak-dot');
    if (dot && dot.dataset.date) { selected = dot.dataset.date; renderWorkout(); return; }
    var row = e.target.closest('[data-row]');
    if (!row) return;
    if (e.target.closest('input, textarea, button, a, label')) return;
    var box = row.querySelector('input[type=checkbox][data-field=done]');
    if (!box) return;
    box.checked = !box.checked;
    box.dispatchEvent(new Event('change', { bubbles: true }));
  });
  document.getElementById('page-workout').addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.id && (t.dataset.field === 'done' || t.dataset.field === 'pain')) {
      setField(t.dataset.id, t.dataset.field, t.checked);
    }
  });
  document.getElementById('page-workout').addEventListener('input', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'day-note') { setNote(t.value); return; }
    if (t.dataset && (t.dataset.field === 'setw' || t.dataset.field === 'setr')) { setSetField(t.dataset.id, parseInt(t.dataset.idx, 10), t.dataset.field === 'setw' ? 'w' : 'r', t.value); return; }
    if (t.dataset && t.dataset.id && t.dataset.field && t.dataset.field !== 'done' && t.dataset.field !== 'pain') {
      setField(t.dataset.id, t.dataset.field, t.value);
    }
  });
  document.getElementById('page-calendar').addEventListener('click', function (e) {
    if (e.target.id === 'cal-prev') {
      calMonth -= 1;
      if (calMonth < 0) { calMonth = 11; calYear -= 1; }
      renderCalendar();
      return;
    }
    if (e.target.id === 'cal-next') {
      calMonth += 1;
      if (calMonth > 11) { calMonth = 0; calYear += 1; }
      renderCalendar();
      return;
    }
    var btn = e.target.closest('.cal-day');
    if (btn && btn.dataset.date) showPage('workout', btn.dataset.date);
  });
  document.getElementById('page-history').addEventListener('click', function (e) {
    if (handleSend(e, null)) return;
    var btn = e.target.closest('.hist-row');
    if (btn && btn.dataset.date) showPage('workout', btn.dataset.date);
  });
  document.querySelectorAll('.nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.page === 'workout') showPage('workout', todayISO());
      else if (b.dataset.page === 'calendar') {
        calYear = parseISO(selected).getFullYear();
        calMonth = parseISO(selected).getMonth();
        showPage('calendar');
      } else showPage(b.dataset.page);
    });
  });

  function namesOn(iso) {
    var plan = getPlan(iso);
    var out = [];
    plan.sections.forEach(function (sec) {
      sec.items.forEach(function (it) { out.push(it.name); });
    });
    return out;
  }
  function has(iso, re) { return namesOn(iso).some(function (n) { return re.test(n); }); }

  function audit() {
    var errors = [];
    if (has('2026-10-06', /floor press|Cable fly|cable fly/)) errors.push('chest still on Tue Oct 6');
    if (has('2026-10-07', /floor press/) === false) errors.push('chest missing Wed Oct 7');
    if (has('2026-10-07', /Cable fly|cable fly/) === false) errors.push('fly missing Wed Oct 7');
    if (has('2026-09-30', /floor press|Cable fly/)) errors.push('chest before Oct 6 on Wed');
    if (has('2026-10-06', /McGill/) === false) errors.push('mcgill missing tuesday');
    if (has('2026-10-08', /McGill/)) errors.push('mcgill on thursday');
    if (getPlan('2026-10-03').rest !== true) errors.push('saturday not rest');
    if (JSON.stringify(getPlan('2026-10-01')).indexOf('6 rounds') === -1) errors.push('hiit rounds');
    if (has('2026-10-04', /swim|run\/row/) === false) errors.push('swim missing Oct 4');
    if (dayKeyET('2026-10-06') !== 'tuesday') errors.push('ET weekday Oct 6');
    if (dayKeyET('2026-10-07') !== 'wednesday') errors.push('ET weekday Oct 7');
    if (has('2026-10-13', /Side-lying external rotation/) === false) errors.push('new PT missing Tue Oct 13');
    if (has('2026-10-15', /Wrist extension eccentrics/) === false) errors.push('new PT missing Thu Oct 15');
    if (has('2026-10-18', /Grip squeeze/) === false) errors.push('new PT missing Sun Oct 18');
    if (has('2026-10-13', /Rotation isometrics|Prone Y|Serratus/)) errors.push('old PT still on Oct 13');
    if (has('2026-10-14', /Wall slides/) === false) errors.push('primer missing Wed Oct 14');
    if (has('2026-10-11', /Dead bug/) && namesOn('2026-10-11').filter(function(n){return /Single-leg balance/.test(n);}).length) errors.push('daily15 before Oct 12');
    ['2026-10-12','2026-10-13','2026-10-14','2026-10-15','2026-10-16','2026-10-17','2026-10-18'].forEach(function (d) {
      if (!has(d, /Single-leg balance/)) errors.push('daily15 missing ' + d);
      if (getPlan(d).sections[0].items[0].id !== 'd15-hip') errors.push('daily15 not top ' + d);
    });
    if (!has('2026-10-14', /Step-up/)) errors.push('step-up missing Wed');
    if (has('2026-10-07', /Step-up/)) errors.push('step-up before start');
    if (!has('2026-10-13', /pushdown/) || !has('2026-10-15', /hammer curl/)) errors.push('arms missing Tue/Thu');
    if (has('2026-10-14', /pushdown|hammer curl/)) errors.push('arms on Wed');
    ['2026-10-12','2026-10-13','2026-10-14','2026-10-15','2026-10-16','2026-10-18'].forEach(function (d) {
      if (has(d, /skullcrusher|straight-bar curl|russian twist|wood ?chop/i)) errors.push('guardrail violation ' + d);
    });
    var exp = {'2026-10-19':'Lower A','2026-10-20':'Upper A','2026-10-21':'Rehab + Swim','2026-10-22':'Lower B','2026-10-23':'Upper B','2026-10-24':'Rehab + Swim','2026-10-25':'Off'};
    Object.keys(exp).forEach(function (d) { if (getPlan(d).title !== exp[d]) errors.push('v2 title ' + d); });
    if (getPlan('2026-10-18').title === 'Off') errors.push('v2 leaked before Oct 19');
    if (has('2026-10-19', /punch/i) && !has('2026-10-21', /Krav/)) errors.push('krav');
    return errors;
  }

  var problems = audit();
  if (problems.length) {
    var banner = document.createElement('div');
    banner.className = 'guardrail-banner';
    banner.style.color = '#ff6b6b';
    banner.textContent = 'Schedule check failed: ' + problems.join('; ');
    document.body.insertBefore(banner, document.body.firstChild);
  }
  showPage('workout', todayISO());
})();
</script>
</body>
</html>
